<!doctype html>
<html lang="ru">

<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="./styles.css">
	<title>Случайный сайт…</title>
</head>

<script>
	var links = []
	{% if sites %}
	{% for site in sites %}
	links.push("{{ site.website.url }}")
	{% endfor %}
	{% endif %}
	window.location.replace(links[Math.floor(Math.random() * links.length)])
</script>

<body>
	<main class="redirect"><p>Ищем для вас случайный сайт…</p></main>
</body>

</html>
